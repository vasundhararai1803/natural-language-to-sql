name: QueryLens AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests & Evaluation Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed database & apply migrations
        run: |
          PYTHONPATH=. python backend/scripts/seed_db.py
          PYTHONPATH=. python backend/scripts/migrate_db.py

      - name: Run Pytest test suite
        run: |
          PYTHONPATH=. pytest backend/tests/test_backend.py -v

      - name: Run 32-Case Evaluation Benchmark
        run: |
          PYTHONPATH=. python -m backend.evaluation.benchmark_runner

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend for production
        run: |
          cd frontend
          npm run build
